services:
  db:
    image: postgres:16-alpine
    container_name: zelo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zelo}
      POSTGRES_USER: ${POSTGRES_USER:-zelo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zelo_pass}
    ports:
      - "5432:5432"
    volumes:
      - zelo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zelo} -d ${POSTGRES_DB:-zelo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: zelo-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-zelo}:${POSTGRES_PASSWORD:-zelo_pass}@db:5432/${POSTGRES_DB:-zelo}

volumes:
  zelo_pgdata:
